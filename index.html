$('editform').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!can(editing.kind,editing.id?'update':'create'))return;if('assigned_to' in f){f.assigned_to=f.assigned_to||null;f.owner=f.assigned_to?teamName(f.assigned_to):'';}if(['cashflow','settlement'].includes(editing.kind)){f.department='finance';if(!f.due||!f.cash_direction||Number(f.actual)<0||(editing.kind==='cashflow'&&Number(f.actual)<=0)||(editing.kind==='settlement'&&(Number(f.planned)<=0||Number(f.actual)>Number(f.planned)))){$('editerror').textContent='Enter a date and valid positive amount; settled cannot exceed expected.';return;}if(editing.kind==='settlement')f.status=Number(f.actual)===Number(f.planned)?'Done':Number(f.actual)>0?'In progress':'Pending';if(editing.kind==='cashflow'&&f.status==='Done'&&f.due>today()){$('editerror').textContent='A future cash transaction cannot be posted. Choose Pending.';return;}}for(let k of ['due','follow_up','dependency','parent_id'])if(k in f)f[k]=f[k]||null;for(let k of ['planned','actual','quantity','orders','ad_cost','progress'])if(k in f)f[k]=Number(f[k]||0);if(f.progress!==undefined&&(!Number.isInteger(f.progress)||f.progress<0||f.progress>100)){$('editerror').textContent='Progress must be a whole number from 0 to 100';return;}if(f.parent_id){let p=records.find(r=>r.id===f.parent_id);if(p)f.department=p.department;}if(f.dependency){let seen=new Set([editing.id]);let d=f.dependency;while(d){if(seen.has(d)){note('Dependency cycle not allowed');return;}seen.add(d);d=records.find(r=>r.id===d)?.dependency;}}if(f.status==='Done'&&f.dependency&&records.some(r=>r.id===f.dependency&&r.status!=='Done')){note('Complete dependency first');return;}if(await write({...f,kind:editing.kind},editing.id)){$('editor').close();if(f.parent_id){expanded.add(f.parent_id);render();}}};
