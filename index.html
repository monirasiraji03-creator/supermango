<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Mango | Mission Control</title><meta name="referrer" content="no-referrer"><script>document.addEventListener("submit",function(e){e.preventDefault()},true);if(location.search){history.replaceState(null,"",location.pathname+location.hash)}</script><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f4f6ef;color:#173b29}header{background:#173b29;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header b{font-size:22px}small{color:inherit;opacity:.8}main{max-width:1150px;margin:auto;padding:20px}nav{display:flex;gap:6px;overflow:auto;padding:10px 0}button,input,select,textarea{font:inherit;border:1px solid #c4d1c3;border-radius:8px;padding:10px}button{cursor:pointer;background:white;color:#173b29}button.primary,nav button.active{background:#24633d;color:white;border-color:#24633d}button:disabled{opacity:.5;cursor:wait}section,.panel,article{background:white;border:1px solid #dbe4d7;border-radius:14px;padding:18px;margin:12px 0}h1,h2,h3,p{margin:0 0 12px}h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{background:#eaf0e3;border-radius:10px;padding:16px}.metric strong{display:block;font-size:24px;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;background:#eaf0e3;border-radius:20px;padding:4px 9px;margin:3px;font-size:12px}.warn{color:#9a400e}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:75px;background:#f1f4ee;padding:5px;border-radius:5px;overflow-wrap:anywhere;font-size:12px}.day button{font-size:11px;padding:3px;width:100%;margin:2px 0;text-align:left}label{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}input,select,textarea{width:100%;background:white;color:#173b29}dialog{border:0;border-radius:15px;width:min(600px,95vw);max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#0007}progress{width:100%;accent-color:#24633d}#notice{white-space:pre-wrap;color:#9a400e}#login{max-width:430px;margin:40px auto}.hidden{display:none!important}@media(max-width:550px){main{padding:10px}.calendar{gap:2px}.day{min-height:65px;padding:3px}header{padding:15px}section,article{padding:12px}}</style></head><body><header><div><b>SUPER MANGO</b><br><small>Mission Control · 2027 · Development prototype · v1.0.1</small></div><div id="account"></div></header><main><p id="notice" role="status">Loading secure login… If this message remains, refresh or check your internet connection.</p><section id="login"><h2>Team login / লগইন</h2><p>Authorized development team only. Use test data, not live business records.</p><form id="loginform" method="post"><fieldset id="loginfields" disabled style="border:0;padding:0;margin:0"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button></fieldset></form></section><div id="workspace" class="hidden"><nav id="nav"></nav><div class="toolbar"><button id="refresh">Refresh / রিফ্রেশ</button><button id="export">Export JSON</button><span id="sync"></span></div><div id="content"></div></div></main><dialog id="editor"><form id="editform" method="post"><h2 id="editheading"></h2><div id="fields"></div><div class="toolbar"><button class="primary" type="submit">Save / সংরক্ষণ</button><button type="button" id="close">Cancel</button></div></form></dialog><script type="module">
let createClient;try{({createClient}=await import('https://esm.sh/@supabase/supabase-js@2.49.4'));}catch(e){document.getElementById('notice').textContent='Authentication library could not load. Check internet access and refresh.';throw e;}
const db=createClient('https://zxrysizswqabcuoknxwl.supabase.co','sb_publishable_IebVrXKD6Mmup8Vw5imMHQ_S-qX9GIK');
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>'৳'+Number(x||0).toLocaleString('en-BD'), today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let records=[],role='',view='Dashboard',editing=null,month=new Date(),filter='',busy=false;
const tabs=['Dashboard','Checklist','Tasks','Timeline','Calendar','Follow-up','Budget','Risks','Growth','Weekly review','Settings'], kinds={'Checklist':'task','Tasks':'task','Timeline':'milestone','Budget':'budget','Risks':'risk','Growth':'growth','Weekly review':'review','Settings':'settings'};
const note=m=>$('notice').textContent=m||'', sum=(a,k)=>a.reduce((s,r)=>s+Number(r[k]||0),0), tasks=()=>records.filter(r=>r.kind==='task'), outstanding=r=>r.status!=='Done', blocked=r=>!!r.dependency&&records.some(d=>d.id===r.dependency&&d.status!=='Done');
function metric(t,v){return '<div class="metric">'+esc(t)+'<strong>'+esc(v)+'</strong></div>'}
function card(r){let dep=records.find(d=>d.id===r.dependency);return '<article><div class="toolbar"><strong>'+esc(r.title)+'</strong><span class="tag">'+esc(r.status)+'</span><span class="tag">'+esc(r.priority)+'</span></div><p>'+esc(r.details)+'</p><small>Owner: '+esc(r.owner||'Unassigned')+' · Due: '+esc(r.due||'—')+' · Follow-up: '+esc(r.follow_up||'—')+'</small>'+(dep?'<p class="'+(blocked(r)?'warn':'')+'">Depends on: '+esc(dep.title)+(blocked(r)?' · Blocked by dependency':'')+'</p>':'')+(['budget','growth','settings'].includes(r.kind)?'<p>Planned '+money(r.planned)+' · Actual '+money(r.actual)+(r.kind==='growth'?' · '+esc(r.quantity)+' kg · '+esc(r.orders)+' orders · Ads '+money(r.ad_cost):'')+'</p>':'')+'<div class="toolbar">'+(r.kind!=='settings'||role==='admin'?'<button data-edit="'+r.id+'">Edit</button>':'')+(r.kind==='task'&&outstanding(r)&&!blocked(r)?'<button data-done="'+r.id+'">Mark done</button>':'')+(role==='admin'&&r.kind!=='settings'?'<button data-delete="'+r.id+'">Delete</button>':'')+'</div></article>'}
function render(){ $('nav').innerHTML=tabs.map(t=>'<button data-tab="'+t+'" class="'+(t===view?'active':'')+'">'+t+'</button>').join('');let ts=tasks(),growth=records.filter(r=>r.kind==='growth'),budget=records.filter(r=>r.kind==='budget'),target=Number(records.find(r=>r.kind==='settings'&&r.title==='Revenue target')?.planned||10000000),revenue=sum(growth,'actual'),due=ts.filter(r=>outstanding(r)&&r.due&&r.due<today()), html='<h1>'+esc(view)+'</h1>';
if(view==='Dashboard'){html+='<section><h2>Mission 10M / লক্ষ্য ১ কোটি</h2><progress max="'+Math.max(target,1)+'" value="'+revenue+'"></progress><p>'+money(revenue)+' / '+money(target)+'</p><div class="grid">'+metric('Tasks completed',ts.filter(r=>!outstanding(r)).length+'/'+ts.length)+metric('Overdue',due.length)+metric('Budget spent',money(sum(budget,'actual')))+metric('Sales volume',sum(growth,'quantity')+' kg')+metric('Open risks',records.filter(r=>r.kind==='risk'&&outstanding(r)).length)+metric('Ad cost',money(sum(growth,'ad_cost')))+'</div></section><h2>Next actions</h2>'+ts.filter(outstanding).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5).map(card).join('');}
else if(view==='Calendar'){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();html+='<section><div class="toolbar"><button data-month="-1">Previous</button><b>'+month.toLocaleString('en',{month:'long',year:'numeric'})+'</b><button data-month="1">Next</button></div><div class="calendar">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<b>'+d+'</b>').join('')+'<div></div>'.repeat(first);for(let d=1;d<=days;d++){let key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');html+='<div class="day">'+d+records.filter(r=>r.due===key||r.follow_up===key).map(r=>'<button data-edit="'+r.id+'">'+esc(r.title)+'</button>').join('')+'</div>'}html+='</div></section>';}
else if(view==='Follow-up'){html+='<p>Overdue, waiting, blocked or follow-up due today.</p>'+ts.filter(r=>outstanding(r)&&(r.status==='Waiting'||r.status==='Blocked'||blocked(r)||(r.due&&r.due<today())||(r.follow_up&&r.follow_up<=today()))).map(card).join('');}
else{let kind=kinds[view],list=records.filter(r=>r.kind===kind||(view==='Timeline'&&r.kind==='task'));if(view==='Timeline')list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));if(view==='Budget')html+='<div class="grid">'+metric('Planned',money(sum(budget,'planned')))+metric('Actual',money(sum(budget,'actual')))+metric('Remaining',money(sum(budget,'planned')-sum(budget,'actual')))+'</div>';if(view==='Growth')html+='<div class="grid">'+metric('Revenue',money(revenue))+metric('Volume',sum(growth,'quantity')+' kg')+metric('Orders',sum(growth,'orders'))+metric('Ad cost/order',sum(growth,'orders')?money(sum(growth,'ad_cost')/sum(growth,'orders')):'—')+'</div>';html+='<div class="toolbar">'+(kind!=='settings'?'<button class="primary" data-add="'+kind+'">+ Add / নতুন</button>':'')+'<input id="search" placeholder="Search records" value="'+esc(filter)+'"></div>'+list.filter(r=>(r.title+' '+r.owner+' '+r.details+' '+r.status).toLowerCase().includes(filter.toLowerCase())).map(card).join('');}
$('content').innerHTML=html;}
async function load(){let {data,error}=await db.from('sm_records').select('*').order('created_at').limit(1000);if(error)throw error;records=data;$('sync').textContent='Synced '+new Date().toLocaleTimeString();render();}
async function session(s){role='';records=[];$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('account').textContent='';if(!s)return;let {data,error}=await db.from('sm_members').select('role').eq('user_id',s.user.id).maybeSingle();if(error||!data){note('Access not approved. Ask the database administrator to add your user to sm_members.');$('account').innerHTML='<button id="logout">Sign out</button>';return;}role=data.role;$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('account').innerHTML=esc(role)+' · <button id="logout">Sign out</button>';await load();}
$('loginform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('loginfields').disabled=true;note('Signing in…');try{let {data,error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;note('');await session(data.session);}catch(e){note(e.message||'Login failed. Please try again.');}finally{e.target.reset();$('loginfields').disabled=false;}};
function field(n,t,v='',type='text'){return '<label>'+esc(t)+'<input name="'+n+'" type="'+type+'" value="'+esc(v)+'" '+(type==='number'?'min="0" step="'+(n==='orders'?'1':'0.01')+'"':'')+' '+(n==='title'?'required maxlength="300"':'')+'></label>'}
function select(n,t,opts,v){return '<label>'+esc(t)+'<select name="'+n+'">'+opts.map(([k,l])=>'<option value="'+esc(k)+'" '+(k===v?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>'}
function edit(r){if(r.kind==='settings'&&role!=='admin')return;editing=r;$('editheading').textContent=r.id?'Edit record':'New '+r.kind;$('fields').innerHTML=field('title','Title / কাজ',r.title)+field('owner','Owner',r.owner)+select('status','Status',['Pending','In progress','Blocked','Waiting','Done'].map(x=>[x,x]),r.status||'Pending')+select('priority','Priority',['Low','Medium','High'].map(x=>[x,x]),r.priority||'Medium')+field('due','Deadline',r.due,'date')+field('follow_up','Follow-up',r.follow_up,'date')+(r.kind==='task'?select('dependency','Depends on',[['','None'],...tasks().filter(t=>t.id!==r.id).map(t=>[t.id,t.title])],r.dependency||''):'')+'<label>Details / next action<textarea name="details" rows="4">'+esc(r.details)+'</textarea></label>'+(['budget','growth','settings'].includes(r.kind)?field('planned','Planned BDT',r.planned||0,'number')+field('actual','Actual BDT',r.actual||0,'number'):'')+(r.kind==='growth'?field('quantity','Volume kg',r.quantity||0,'number')+field('orders','Delivered orders',r.orders||0,'number')+field('ad_cost','Ad cost BDT',r.ad_cost||0,'number'):'');$('editor').showModal();}
async function write(p,id){if(busy)return;busy=true;try{let q=id?db.from('sm_records').update(p).eq('id',id):db.from('sm_records').insert(p);let {data,error}=await q.select('id').single();if(error||!data)throw error||Error('No row saved');await load();note('Saved to database.');return true;}catch(e){note(e.message);return false;}finally{busy=false;}}
$('editform').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));for(let k of ['due','follow_up','dependency'])if(k in f)f[k]=f[k]||null;for(let k of ['planned','actual','quantity','orders','ad_cost'])if(k in f)f[k]=Number(f[k]||0);if(f.dependency){let seen=new Set([editing.id]);let d=f.dependency;while(d){if(seen.has(d)){note('Dependency cycle not allowed');return;}seen.add(d);d=records.find(r=>r.id===d)?.dependency;}}if(f.status==='Done'&&f.dependency&&records.some(r=>r.id===f.dependency&&r.status!=='Done')){note('Complete dependency first');return;}if(await write({...f,kind:editing.kind},editing.id))$('editor').close();};
$('close').onclick=()=>$('editor').close();$('refresh').onclick=()=>load().catch(e=>note(e.message));$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='super-mango-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;try{if(b.id==='logout'){await db.auth.signOut();await session(null);note('Signed out');}if(d.tab){view=d.tab;filter='';render();}if(d.add)edit({kind:d.add});if(d.edit){let r=records.find(r=>r.id===d.edit);if(r)edit(r);}if(d.done)await write({status:'Done'},d.done);if(d.delete&&confirm('Delete this record?')){let {data,error}=await db.from('sm_records').delete().eq('id',d.delete).select('id').single();if(error||!data)throw error||Error('Delete denied');await load();}if(d.month){month=new Date(month.getFullYear(),month.getMonth()+Number(d.month),1);render();}}catch(e){note(e.message);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;render();$('search').focus();$('search').setSelectionRange(filter.length,filter.length);}});
$('loginfields').disabled=false;note('');db.auth.getSession().then(({data,error})=>{if(error)throw error;return session(data.session)}).catch(e=>note(e.message));
</script></body></html>
